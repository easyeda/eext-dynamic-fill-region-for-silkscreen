<!doctype html>
<html lang="zh-Hans">
<head>
  <title id="pageTitle"></title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 12px 16px;
      margin: 0;
      font-size: 14px;
      color: #333;
      user-select: none;
      overflow: hidden;
    }
    .row {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label { min-width: 40px; }
    input[type="number"] {
      width: 80px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .options {
      margin-bottom: 6px;
      padding: 6px 8px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 4px;
    }
    .options-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }
    .opt-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .opt-item input[type="checkbox"] {
      margin: 0;
    }
    .btn {
      padding: 7px 0;
      width: 100%;
      cursor: pointer;
      border: 1px solid #1890ff;
      border-radius: 4px;
      background: #1890ff;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .btn:hover { background: #40a9ff; }
    .btn:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
    .btn.finish {
      background: #52c41a;
      border-color: #52c41a;
    }
    .btn.finish:hover { background: #73d13d; }
    .btn-fill-avoid {
      background: #fa8c16;
      border-color: #fa8c16;
    }
    .btn-fill-avoid:hover { background: #ffa039; }
  </style>
</head>
<body>
  <div class="row">
    <label id="lblGap"></label>
    <input type="number" id="gap" value="10" min="0" max="1000" />
    <span>mil</span>
  </div>
  <div class="row">
    <label id="lblLayer"></label>
    <label><input type="radio" name="layer" id="layerTop" value="3" checked /> <span id="lblTopSilk"></span></label>
    <label><input type="radio" name="layer" id="layerBottom" value="4" /> <span id="lblBottomSilk"></span></label>
  </div>
  <div class="options">
    <div class="options-title" id="optTitle"></div>
    <div class="options-grid">
      <label class="opt-item"><input type="checkbox" id="optSelectAll" /> <span id="lblSelectAll"></span></label>
      <label class="opt-item"><input type="checkbox" id="optComponentBBox" checked /> <span id="lblFootprint"></span></label>
      <label class="opt-item"><input type="checkbox" id="optVias" checked /> <span id="lblVias"></span></label>
      <label class="opt-item"><input type="checkbox" id="optPads" checked /> <span id="lblFloatingPads"></span></label>
      <label class="opt-item"><input type="checkbox" id="optCutouts" checked /> <span id="lblCutouts"></span></label>
      <label class="opt-item"><input type="checkbox" id="optTextSilk" checked /> <span id="lblSilkText"></span></label>
      <label class="opt-item"><input type="checkbox" id="optLinesSilk" checked /> <span id="lblSilkLines"></span></label>
      <label class="opt-item"><input type="checkbox" id="optTextCopper" /> <span id="lblCopperText"></span></label>
      <label class="opt-item"><input type="checkbox" id="optLinesCopper" /> <span id="lblCopperLines"></span></label>
      <label class="opt-item"><input type="checkbox" id="optTracksCopper" /> <span id="lblCopperTracks"></span></label>
    </div>
  </div>
  <div class="row">
    <button id="btnToggle" class="btn"></button>
  </div>
  <div class="row">
    <button id="btnFillAvoid" class="btn btn-fill-avoid"></button>
  </div>

  <script>
    var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
    function t(tag, ...args) {
      if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
      return tag;
    }

    document.getElementById('pageTitle').textContent = t('Dynamic Silkscreen Fill');
    document.getElementById('lblGap').textContent = t('Gap:');
    document.getElementById('lblLayer').textContent = t('Layer:');
    document.getElementById('lblTopSilk').textContent = t('Top Silkscreen');
    document.getElementById('lblBottomSilk').textContent = t('Bottom Silkscreen');
    document.getElementById('optTitle').textContent = t('Avoidance Objects:');
    document.getElementById('lblSelectAll').textContent = t('Select All');
    document.getElementById('lblFootprint').textContent = t('Footprint');
    document.getElementById('lblVias').textContent = t('Vias');
    document.getElementById('lblFloatingPads').textContent = t('Floating Pads');
    document.getElementById('lblCutouts').textContent = t('Cutout Areas');
    document.getElementById('lblSilkText').textContent = t('Silkscreen Text');
    document.getElementById('lblSilkLines').textContent = t('Silkscreen Lines');
    document.getElementById('lblCopperText').textContent = t('Copper Text');
    document.getElementById('lblCopperLines').textContent = t('Copper Lines');
    document.getElementById('lblCopperTracks').textContent = t('Copper Tracks');
    document.getElementById('btnToggle').textContent = t('Start Drawing');
    document.getElementById('btnFillAvoid').textContent = t('Select Fill Avoidance');

    var drawing = false;
    var btn = document.getElementById('btnToggle');
    var gapInput = document.getElementById('gap');
    var layerTop = document.getElementById('layerTop');
    var layerBottom = document.getElementById('layerBottom');

    var optSelectAll = document.getElementById('optSelectAll');
    var optComponentBBox = document.getElementById('optComponentBBox');
    var optVias = document.getElementById('optVias');
    var optPads = document.getElementById('optPads');
    var optCutouts = document.getElementById('optCutouts');
    var optTextCopper = document.getElementById('optTextCopper');
    var optTextSilk = document.getElementById('optTextSilk');
    var optLinesSilk = document.getElementById('optLinesSilk');
    var optLinesCopper = document.getElementById('optLinesCopper');
    var optTracksCopper = document.getElementById('optTracksCopper');

    optSelectAll.addEventListener('change', function() {
      var checked = optSelectAll.checked;
      optComponentBBox.checked = checked;
      optVias.checked = checked;
      optPads.checked = checked;
      optCutouts.checked = checked;
      optTextSilk.checked = checked;
      optLinesSilk.checked = checked;
      optTextCopper.checked = checked;
      optLinesCopper.checked = checked;
      optTracksCopper.checked = checked;
    });

    function startDrawing() {
      var gap = parseFloat(gapInput.value) || 0;
      if (gap < 0) gap = 0;
      var layer = parseInt(document.querySelector('input[name="layer"]:checked').value);
      window.parent.__df_cmd = {
        type: 'start',
        gap: gap,
        layer: layer,
        options: {
          componentBBox: optComponentBBox.checked,
          vias: optVias.checked,
          pads: optPads.checked,
          cutouts: optCutouts.checked,
          textCopper: optTextCopper.checked,
          textSilk: optTextSilk.checked,
          linesSilk: optLinesSilk.checked,
          linesCopper: optLinesCopper.checked,
          tracksCopper: optTracksCopper.checked
        }
      };
      drawing = true;
      btn.textContent = t('Finish Drawing');
      btn.className = 'btn finish';
      gapInput.disabled = true;
      layerTop.disabled = true;
      layerBottom.disabled = true;
    }

    function finishDrawing() {
      window.parent.__df_cmd = { type: 'finish' };
    }

    function cancelDrawing() {
      window.parent.__df_cmd = { type: 'stop' };
    }

    btn.addEventListener('click', function() {
      if (!drawing) {
        startDrawing();
      } else {
        finishDrawing();
      }
    });

    var btnFillAvoid = document.getElementById('btnFillAvoid');
    btnFillAvoid.addEventListener('click', function() {
      var gap = parseFloat(gapInput.value) || 0;
      if (gap < 0) gap = 0;
      window.parent.__df_cmd = {
        type: 'fillAvoid',
        gap: gap,
        options: {
          componentBBox: optComponentBBox.checked,
          vias: optVias.checked,
          pads: optPads.checked,
          cutouts: optCutouts.checked,
          textCopper: optTextCopper.checked,
          textSilk: optTextSilk.checked,
          linesSilk: optLinesSilk.checked,
          linesCopper: optLinesCopper.checked,
          tracksCopper: optTracksCopper.checked
        }
      };
    });

    function resetDrawingState() {
      drawing = false;
      btn.textContent = t('Start Drawing');
      btn.className = 'btn';
      gapInput.disabled = false;
      layerTop.disabled = false;
      layerBottom.disabled = false;
    }

    function resetUI() {
      resetDrawingState();
      optSelectAll.checked = false;
      optComponentBBox.checked = true;
      optVias.checked = true;
      optPads.checked = true;
      optCutouts.checked = true;
      optTextCopper.checked = false;
      optTextSilk.checked = true;
      optLinesSilk.checked = true;
      optLinesCopper.checked = false;
      optTracksCopper.checked = false;
    }

    // Keyboard shortcuts: Enter = finish, Escape = cancel
    document.addEventListener('keydown', function(e) {
      if (!drawing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        finishDrawing();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelDrawing();
      }
    });

    setInterval(function() {
      try {
        var s = window.parent.__df_status;
        if (s) {
          delete window.parent.__df_status;
          if (s.type === 'done') {
            resetDrawingState();
          } else if (s.type === 'reset') {
            resetUI();
          }
        }
      } catch(e) {}
    }, 200);

  </script>
</body>
</html>
